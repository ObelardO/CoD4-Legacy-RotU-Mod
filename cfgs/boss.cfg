//
// Boss stages. Order is a list of stage indexes, split by ';'.
// The loader accepts 1 through 5. This file defines 1 through 4 only.
// Repeats are allowed: "1;1;2" runs stage 1 twice.
//
// Damage percent is 0-100. Under 10, a shield icon shows under the hit marker.
// Damage mode:
//   0  no damage, no hit marker, no stun
//   1  bar damage only while the boss is not stunned
//   2  bar damage only while the boss is stunned
//   3  no bar damage; the raw hit fills the stun meter
//   4  bar damage at the percent, and the raw hit fills the stun meter
//   5  bar damage whether or not the boss is stunned; no stun
//
// One crosshair per hit. Red means the bar moved. Blue means that hit filled
// the stun meter and did not move the bar. The shield sits under the crosshair.
//
// Targets, first match wins: players, best_player, far_player, go_away,
// gl_turrets, mg_turrets, map_center, raygun_player, none
// Attacks, first allowed wins: melee, jump, soul, fire, none
// Attack usage: 0 anyone, 1 anyone except the last player, 2 only the last player
//

set surv_boss_stages "1;2;3;4"

// Stage 1 i?? Armor. Explosives break the bar. Rifles do nothing.
set surv_boss_difficulty_stage1 1

